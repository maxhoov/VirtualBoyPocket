  <path d="M123 67 L123 100 M123 100 L73 145 M123 100 L174 145" fill="none" stroke="#999" stroke-width="9" stroke-linejoin="round"/>
  <path d="M115 96 L82 141 M131 96 L165 141" fill="none" stroke="#eee" stroke-width="2"/>
  <path d="M65 145 H86 M161 145 H182" stroke="#bbb" stroke-width="6" stroke-linecap="round"/>
  <circle cx="123" cy="97" r="9" fill="#333" stroke="#ccc" stroke-width="3"/>
  <circle cx="123" cy="97" r="3" fill="#ddd"/>
